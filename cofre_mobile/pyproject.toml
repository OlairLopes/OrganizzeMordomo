[project]
name = "cofre-mobile"
version = "0.1.0"
description = "Fiel Finance — Controle Financeiro Pessoal (app nativo Android/iOS via Flet)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Olair Lopes" }
]
dependencies = [
    "flet>=0.86.4",
    "flet-charts>=0.86.4",
    "certifi",
    "requests",
    "beautifulsoup4",
    "flet-qrscanner @ file:///C:/Users/olair/OneDrive/Software/flet_qrscanner",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.4",
    "flet-desktop>=0.86.4",
    "flet-web>=0.86.4",
]

[tool.flet]
org = "com.olairlopes"
product = "Fiel Finance"
company = "Olair Lopes"
copyright = "Copyright (C) 2026 by Olair Lopes"
permissions = ["camera"]

[tool.flet.app]
path = "src"
